{% extends "_base.html" %}
{% block title %}Log in — Hive Inference Proxy{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="auth-shell">
<div class="card login-panel">
  <p class="login-kicker">hive mind access gate</p>
  <h1>Proxy Login</h1>
  <p class="login-copy">Operator access for clients, credentials, models, and usage.</p>
  {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="login-form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Enter Proxy</button>
  </form>
</div>
</section>
{% endblock %}
