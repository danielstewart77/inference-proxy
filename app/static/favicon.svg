<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Azure OpenAI Proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b94ff"/>
      <stop offset="1" stop-color="#3a6fe0"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile, theme blue -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Relay: client node -> proxy hub -> upstream node -->
  <path d="M7.5 16 H24.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="7.5" cy="16" r="2.5" fill="#ffffff"/>
  <circle cx="24.5" cy="16" r="2.5" fill="#ffffff"/>
  <!-- Center proxy hub, in the status-operational green -->
  <circle cx="16" cy="16" r="5" fill="#2bd07f" stroke="#ffffff" stroke-width="2"/>
</svg>
