services:
  inference-proxy:
    image: inference-proxy:latest
    build: .
    container_name: ${CONTAINER_NAME:-inference-proxy}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "${PORT:-8888}:8888"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
